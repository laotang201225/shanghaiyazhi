[main]
; 1 = enable suppression, 0 = pass-through logging only
enabled=1
; Percentage of damage suppressed (0..99.999999). 99.99 => deals 0.01% final damage
suppress_percent=99.99
; 1 = accumulate fractional (<1) damage per monster until >= 1; 0 = round with min_damage floor
fractional_accum=1
; Minimum damage floor when fractional_accum=0 and raw damage > 0
min_damage=0
; 1 = all combat dungeons (ordinary + towers/altars), 0 = ordinary dungeon (module 3) only
all_dungeons=1
; 1 = only suppress when attacker == localPlayer, 0 = suppress all hits passing through CalcDamage
only_local_player=1
